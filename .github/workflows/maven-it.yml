# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
# Runs the testing/it/http and (on demand) testing/it/e2e-selenium ITs against a
# Dockerized AEM. All container + provisioning + failsafe orchestration lives in
# testing/it/docker/run-it.sh so this workflow and the local dev flow share it.
#
# Structure: a single `prep` job builds the deployable packages and primes the
# AEM image cache ONCE; the test jobs (`integration-test`, and the sharded
# `selenium` matrix) depend on it and only download the packages + load the cached
# image, so the expensive build/pull is not repeated per leg. The Selenium matrix
# is generated by testing/it/docker/gen-selenium-matrix.sh: one leg per @Tag
# group (group1..group4, run in parallel), plus an ungrouped leg for classes
# with no group tag.
#
# Requires repo secrets ARTIFACTORY_CLOUD_USER / ARTIFACTORY_CLOUD_PASS for the
# private Adobe AEM image registry (not exposed to forks - hence the canonical-repo
# guard).
#
# Runs on a self-hosted runner backed by an Ubuntu Docker image/container. That
# container needs its own access to a Docker daemon (e.g. the host's
# /var/run/docker.sock bind-mounted in, or Docker-in-Docker) so this workflow's
# own `docker run`/`docker exec`/`docker pull`/`docker load` calls work - if the
# runner container has no Docker access at all, every job past checkout fails.
# There is no GUI session inside the container, so the Selenium job starts its
# own virtual display (Xvfb + fluxbox) for Chrome - see run-it.sh's
# headless-display comment for how this differs from a local macOS dev run.

name: Integration Tests (AEM)

on:
  workflow_dispatch:
    inputs:
      keep_aem:
        description: 'Leave the AEM container running at the end of the job'
        type: boolean
        default: false
  push:
    branches:
      - main
      # TEMPORARY: allows validation directly on the feature branch. Remove before merge.
      - it-docker-aem

concurrency:
  # Include the event name so a push run and a manual workflow_dispatch run on the
  # same ref don't cancel each other (they are different intents); a newer run of
  # the SAME event still supersedes the older one.
  group: it-aem-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: docker-adobe-cif-release.dr-uw2.adobeitc.com
  AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-cloudready:27830-v2-openjdk21
  # Bump to force a fresh cache lineage (Maven + Docker image) without a code change.
  CACHE_VERSION: '1'

jobs:
  # --------------------------------------------------------------------------
  # Build packages + prime caches ONCE; publish artifacts + the selenium matrix.
  # --------------------------------------------------------------------------
  prep:
    name: prep (build + prime caches)
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'adobe/aem-core-wcm-components' }}
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      selenium_matrix: ${{ steps.genmatrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # Self-hosted runners aren't guaranteed to have Maven pre-installed (unlike
      # GitHub-hosted ubuntu-latest). Install it via apt if missing, so this job
      # doesn't depend on manual provisioning of the runner container. Tries
      # plain apt-get first (the container may already run as root), falling
      # back to sudo for a non-root runner user.
      - name: Setup Maven (if missing)
        run: |
          if command -v mvn >/dev/null 2>&1; then
            echo "Maven already available: $(mvn -v | head -1)"
          elif apt-get update && apt-get install -y maven; then
            :
          elif command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y maven; then
            :
          else
            echo "::error::mvn not found on PATH and apt-get install failed (as root and via sudo). Install Maven on this self-hosted runner." >&2
            exit 1
          fi

      - name: Restore Maven repository cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            it-aem-m2-${{ env.CACHE_VERSION }}-

      # Full reactor build once: installs SNAPSHOT artifacts into ~/.m2 (so the test
      # jobs can compile a single module without a reactor build) and produces the
      # deployable zips uploaded below.
      - name: Build packages
        run: mvn -B -U clean install -Pcloud,adobe-public -DskipTests -s ./.github/workflows/settings.xml

      - name: Save Maven repository cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}

      - name: Upload deployable packages
        uses: actions/upload-artifact@v5
        with:
          name: it-packages
          if-no-files-found: error
          retention-days: 1
          path: |
            all/target/*.zip
            testing/it/it.ui.apps/target/*.zip
            testing/it/it.ui.config/target/*.zip
            testing/it/it.ui.content/target/*.zip
            testing/it/it.core/target/*.jar

      # Prime the AEM image cache: pull once here so the test legs all get a cache hit.
      - name: Compute AEM image cache key
        id: imgkey
        run: echo "key=aem-image-${CACHE_VERSION}-$(echo "$AEM_IMAGE" | tr '/:' '__')" >> "$GITHUB_OUTPUT"

      - name: Restore AEM Docker image cache
        id: aem-image-cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}

      - name: Pull + save AEM image (on cache miss)
        if: ${{ steps.aem-image-cache.outputs.cache-hit != 'true' }}
        run: |
          echo "${{ secrets.ARTIFACTORY_CLOUD_PASS }}" | docker login "${REGISTRY}" -u "${{ secrets.ARTIFACTORY_CLOUD_USER }}" --password-stdin
          docker pull "$AEM_IMAGE"
          docker save -o /tmp/aem-image.tar "$AEM_IMAGE"

      - name: Save AEM Docker image cache
        if: ${{ always() && steps.aem-image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}

      - name: Generate Selenium shard matrix
        id: genmatrix
        run: echo "matrix=$(bash testing/it/docker/gen-selenium-matrix.sh)" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # http ITs (author + publish). Consumes prep's packages + cached image.
  # --------------------------------------------------------------------------
  integration-test:
    name: http ITs (author + publish, cloud-ready)
    needs: prep
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'adobe/aem-core-wcm-components' }}
    runs-on: self-hosted
    # Generous: kept high from when the self-hosted runner ran the linux/amd64 AEM
    # image under Docker emulation (author+publish boot alone took ~3.5 min each
    # under emulation, vs. seconds/low-minutes natively). Revisit once this
    # Ubuntu-in-Docker runner's actual architecture/performance is confirmed.
    timeout-minutes: 120
    env:
      WITH_PUBLISH: 'true'
      QP_VM_OPTIONS: '-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true'
      PUBLISH_VM_OPTIONS: '-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true'
      KEEP_AEM: ${{ inputs.keep_aem || false }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # Self-hosted runners aren't guaranteed to have Maven pre-installed (unlike
      # GitHub-hosted ubuntu-latest). Install it via apt if missing, so this job
      # doesn't depend on manual provisioning of the runner container. Tries
      # plain apt-get first (the container may already run as root), falling
      # back to sudo for a non-root runner user.
      - name: Setup Maven (if missing)
        run: |
          if command -v mvn >/dev/null 2>&1; then
            echo "Maven already available: $(mvn -v | head -1)"
          elif apt-get update && apt-get install -y maven; then
            :
          elif command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y maven; then
            :
          else
            echo "::error::mvn not found on PATH and apt-get install failed (as root and via sudo). Install Maven on this self-hosted runner." >&2
            exit 1
          fi
      - name: Restore Maven repository cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            it-aem-m2-${{ env.CACHE_VERSION }}-
      - name: Download deployable packages
        uses: actions/download-artifact@v5
        with:
          name: it-packages
      - name: Compute AEM image cache key
        id: imgkey
        run: echo "key=aem-image-${CACHE_VERSION}-$(echo "$AEM_IMAGE" | tr '/:' '__')" >> "$GITHUB_OUTPUT"
      - name: Restore AEM Docker image cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}
      - name: Load AEM image
        run: docker load -i /tmp/aem-image.tar
      - name: Run http integration tests
        run: bash testing/it/docker/run-it.sh
      - name: Publish integration test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Integration Tests (http, author + publish, cloud-ready)
          report_paths: testing/it/http/target/failsafe-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true
          group_suite: true
          fail_on_failure: false
      - name: Upload test results and AEM logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: it-http-author-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            testing/it/http/target/failsafe-reports
            testing/it/http/target/aem-logs

  # --------------------------------------------------------------------------
  # Selenium ITs, one leg per @Tag group + ungrouped. Manual only.
  # --------------------------------------------------------------------------
  selenium:
    name: Selenium ITs (${{ matrix.name }}, cloud-ready)
    needs: prep
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    # Generous: kept high from when the self-hosted runner emulated the
    # linux/amd64 AEM image (browser-driven UI tests were noticeably slower under
    # emulation locally). Revisit once this Ubuntu-in-Docker runner's actual
    # architecture/performance is confirmed.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.selenium_matrix) }}
    env:
      WITH_SELENIUM: 'true'
      SEL_BROWSER: chrome
      SEL_GROUPS: ${{ matrix.sel_groups }}
      SEL_IT_TEST: ${{ matrix.sel_it_test }}
      QP_VM_OPTIONS: '-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true'
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # Self-hosted runners aren't guaranteed to have Maven pre-installed (unlike
      # GitHub-hosted ubuntu-latest). Install it via apt if missing, so this job
      # doesn't depend on manual provisioning of the runner container. Tries
      # plain apt-get first (the container may already run as root), falling
      # back to sudo for a non-root runner user.
      - name: Setup Maven (if missing)
        run: |
          if command -v mvn >/dev/null 2>&1; then
            echo "Maven already available: $(mvn -v | head -1)"
          elif apt-get update && apt-get install -y maven; then
            :
          elif command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y maven; then
            :
          else
            echo "::error::mvn not found on PATH and apt-get install failed (as root and via sudo). Install Maven on this self-hosted runner." >&2
            exit 1
          fi

      # No GUI session inside the runner container, so give the host-local Chrome
      # a virtual display: Xvfb (framebuffer) + fluxbox (window manager - the
      # selenium base lib calls window.maximize() per test, which needs a real WM,
      # not just a bare X server). Same root/sudo fallback as the Maven step.
      - name: Set up virtual display (Xvfb + fluxbox)
        run: |
          if apt-get update && apt-get install -y xvfb fluxbox; then
            :
          elif command -v sudo >/dev/null 2>&1 && sudo apt-get update && sudo apt-get install -y xvfb fluxbox; then
            :
          else
            echo "::error::apt-get install of xvfb/fluxbox failed (as root and via sudo)." >&2
            exit 1
          fi
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          DISPLAY=:99 fluxbox >/tmp/fluxbox.log 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Restore Maven repository cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            it-aem-m2-${{ env.CACHE_VERSION }}-
      - name: Download deployable packages
        uses: actions/download-artifact@v5
        with:
          name: it-packages
      - name: Compute AEM image cache key
        id: imgkey
        run: echo "key=aem-image-${CACHE_VERSION}-$(echo "$AEM_IMAGE" | tr '/:' '__')" >> "$GITHUB_OUTPUT"
      - name: Restore AEM Docker image cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}
      - name: Load AEM image
        run: docker load -i /tmp/aem-image.tar
      - name: Run Selenium ITs (${{ matrix.name }})
        run: bash testing/it/docker/run-it.sh
      - name: Publish Selenium test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Selenium ITs (${{ matrix.name }}, cloud-ready)
          report_paths: testing/it/e2e-selenium/target/failsafe-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true
          group_suite: true
          fail_on_failure: true
      - name: Upload Selenium results and AEM logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: it-selenium-reports-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            testing/it/e2e-selenium/target/failsafe-reports
            testing/it/http/target/aem-logs

  # --------------------------------------------------------------------------
  # Aggregate every leg's failsafe reports into one Step Summary (totals + the
  # list of failing tests). Runs regardless of test outcomes.
  # --------------------------------------------------------------------------
  summary:
    name: Test results summary
    needs: [integration-test, selenium]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.repository == 'adobe/aem-core-wcm-components') }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download all test report artifacts
        uses: actions/download-artifact@v5
        with:
          path: all-reports
          pattern: 'it-*reports*'
      - name: Write results summary
        run: node testing/it/docker/summarize-it.js all-reports >> "$GITHUB_STEP_SUMMARY"
