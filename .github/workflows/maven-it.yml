#
# Runs the testing/it/http integration tests against a Dockerized AEM author
# instance (PHASE 1: author-only, single AEM flavor). All the container +
# provisioning + failsafe orchestration lives in testing/it/docker/run-it.sh so
# this workflow and the local developer flow share one code path.
#
# Requires two repository secrets for the private Adobe AEM image registry:
#   ARTIFACTORY_CLOUD_USER, ARTIFACTORY_CLOUD_PASS
# Because those secrets are not exposed to fork PRs, this job only runs on the
# canonical repository (push to main) or on manual dispatch - never on forks.

name: Integration Tests (AEM)

on:
  workflow_dispatch:
    inputs:
      keep_aem:
        description: 'Leave the AEM container running at the end of the job (for debugging via a follow-up tmate step)'
        type: boolean
        default: false
  push:
    branches:
      - main
      # TEMPORARY: allows a first validation run directly on the feature branch.
      # Remove before merging to main.
      - it-docker-aem

concurrency:
  group: it-aem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: http ITs (author + publish, cloud-ready)
    # Skip on forks: the private-image secrets are unavailable there.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'adobe/aem-core-wcm-components' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REGISTRY: docker-adobe-cif-release.dr-uw2.adobeitc.com
      # Cloud-ready image. The image is a QuickProvider server; run-it.sh starts the
      # author and publish instances inside it. See testing/it/docker/README.md.
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-cloudready:27830-v2-openjdk21
      # Run the full suite against author + publish. Heaps sized for the 16 GB
      # public-repo runner (two instances): ~3g heap + 1g metaspace each.
      WITH_PUBLISH: 'true'
      QP_VM_OPTIONS: '-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true'
      PUBLISH_VM_OPTIONS: '-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true'
      KEEP_AEM: ${{ inputs.keep_aem || false }}
      # Bump to force a fresh cache lineage (Maven + Docker image) without a code change.
      CACHE_VERSION: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Explicit restore/save (not setup-java's cache: maven) so a failing run - which
      # this job can be while ITs are stabilising - still persists what it downloaded.
      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            it-aem-m2-${{ env.CACHE_VERSION }}-

      # Build the deployable packages (all + it.ui.* zips) the IT script installs
      # into AEM. Unit tests are already covered by maven-test.yml, so skip them
      # here to keep this job focused on packaging.
      - name: Build packages
        run: mvn -B -U clean install -Pcloud,adobe-public -DskipTests -s ./.github/workflows/settings.xml

      # Cache the (multi-GB) AEM image across runs: on a hit we `docker load` the
      # saved tarball instead of pulling. Keyed on the image ref, so bumping
      # AEM_IMAGE (or CACHE_VERSION) naturally invalidates it.
      - name: Compute AEM image cache key
        id: imgkey
        run: echo "key=aem-image-${CACHE_VERSION}-$(echo "$AEM_IMAGE" | tr '/:' '__')" >> "$GITHUB_OUTPUT"

      # Split restore/save (not combined actions/cache) so the tarball is saved even
      # when the ITs fail - the combined action skips its post-save on job failure.
      - name: Restore AEM Docker image cache
        id: aem-image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}

      - name: Load or pull AEM image
        run: |
          if [ -f /tmp/aem-image.tar ]; then
            echo "Cache hit - loading AEM image from tarball"
            docker load -i /tmp/aem-image.tar
          else
            echo "Cache miss - logging in and pulling AEM image"
            echo "${{ secrets.ARTIFACTORY_CLOUD_PASS }}" | docker login "${REGISTRY}" -u "${{ secrets.ARTIFACTORY_CLOUD_USER }}" --password-stdin
            docker pull "$AEM_IMAGE"
            docker save -o /tmp/aem-image.tar "$AEM_IMAGE"
          fi

      - name: Run http integration tests against Dockerized AEM
        run: bash testing/it/docker/run-it.sh

      - name: Publish integration test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Integration Tests (http, author + publish, cloud-ready)
          report_paths: testing/it/http/target/failsafe-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true
          group_suite: true
          fail_on_failure: false

      - name: Upload test results and AEM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-http-author-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            testing/it/http/target/failsafe-reports
            testing/it/http/target/aem-logs

      # Save whatever was downloaded even if the ITs failed, so the next run starts warm.
      - name: Save Maven repository cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}

      # Save the pulled image tarball even on failure (only when it wasn't a cache hit),
      # so subsequent runs skip the multi-GB pull via docker load.
      - name: Save AEM Docker image cache
        if: always() && steps.aem-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}

  # Selenium (e2e-selenium) UI suite. Manual (workflow_dispatch) only - it is much
  # slower than the http ITs. Uses a host-local headless Chrome (preinstalled on the
  # runner) under Xvfb, driven by run-it.sh's WITH_SELENIUM mode against the author.
  selenium:
    name: Selenium ITs (${{ matrix.group }}, cloud-ready)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Shard the e2e-selenium suite by its JUnit @Tag groups so the legs run in
      # parallel (each leg = its own AEM instance + one group). fail-fast off so one
      # failing group doesn't cancel the others. The 'ungrouped' leg covers the few
      # classes that carry no group tag, so the whole suite is exercised.
      fail-fast: false
      matrix:
        include:
          - group: group1
            sel_groups: group1
            sel_it_test: ''
          - group: group2
            sel_groups: group2
            sel_it_test: ''
          - group: group3
            sel_groups: group3
            sel_it_test: ''
          - group: group4
            sel_groups: group4
            sel_it_test: ''
          - group: ungrouped
            sel_groups: ''
            sel_it_test: 'com.adobe.cq.wcm.core.components.it.seljup.tests.pdfviewer.v1.PdfViewerIT,com.adobe.cq.wcm.core.components.it.seljup.tests.separator.v1.SeparatorIT,com.adobe.cq.wcm.core.components.it.seljup.tests.download.v1.DownloadIT,com.adobe.cq.wcm.core.components.it.seljup.tests.download.v2.DownloadIT'
    env:
      REGISTRY: docker-adobe-cif-release.dr-uw2.adobeitc.com
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-cloudready:27830-v2-openjdk21
      WITH_SELENIUM: 'true'
      SEL_BROWSER: chrome
      SEL_GROUPS: ${{ matrix.sel_groups }}
      SEL_IT_TEST: ${{ matrix.sel_it_test }}
      QP_VM_OPTIONS: '-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true'
      CACHE_VERSION: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # The host-local Chrome needs a virtual display AND a window manager: the
      # selenium base lib calls window.maximize() in its per-test setup, which
      # fails under bare Xvfb (no WM). Xvfb (24-bit screen) + fluxbox + DISPLAY
      # gives Chrome a real windowed environment. Chrome is preinstalled on ubuntu-latest.
      - name: Set up virtual display (Xvfb + fluxbox)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb fluxbox
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          DISPLAY=:99 fluxbox >/tmp/fluxbox.log 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            it-aem-m2-${{ env.CACHE_VERSION }}-

      - name: Build packages
        run: mvn -B -U clean install -Pcloud,adobe-public -DskipTests -s ./.github/workflows/settings.xml

      - name: Compute AEM image cache key
        id: imgkey
        run: echo "key=aem-image-${CACHE_VERSION}-$(echo "$AEM_IMAGE" | tr '/:' '__')" >> "$GITHUB_OUTPUT"

      - name: Restore AEM Docker image cache
        id: aem-image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}

      - name: Load or pull AEM image
        run: |
          if [ -f /tmp/aem-image.tar ]; then
            echo "Cache hit - loading AEM image from tarball"
            docker load -i /tmp/aem-image.tar
          else
            echo "Cache miss - logging in and pulling AEM image"
            echo "${{ secrets.ARTIFACTORY_CLOUD_PASS }}" | docker login "${REGISTRY}" -u "${{ secrets.ARTIFACTORY_CLOUD_USER }}" --password-stdin
            docker pull "$AEM_IMAGE"
            docker save -o /tmp/aem-image.tar "$AEM_IMAGE"
          fi

      - name: Run Selenium ITs against Dockerized AEM
        run: bash testing/it/docker/run-it.sh

      - name: Publish Selenium test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Selenium ITs (${{ matrix.group }}, cloud-ready)
          report_paths: testing/it/e2e-selenium/target/failsafe-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true
          group_suite: true
          # e2e-selenium's test-all binds only failsafe:integration-test (not verify),
          # so `mvn verify` won't fail on test errors - gate the job on the report instead.
          fail_on_failure: true

      - name: Upload Selenium results and AEM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-selenium-reports-${{ matrix.group }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            testing/it/e2e-selenium/target/failsafe-reports
            testing/it/http/target/aem-logs

      - name: Save Maven repository cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: it-aem-m2-${{ env.CACHE_VERSION }}-${{ hashFiles('**/pom.xml') }}

      - name: Save AEM Docker image cache
        if: always() && steps.aem-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/aem-image.tar
          key: ${{ steps.imgkey.outputs.key }}
